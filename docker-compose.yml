version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: ada-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - ada-net

  backend:
    image: tejakumar103/poc_backend:2.0
    container_name: ada-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - mysql
    ports:
      - "5000:5000"
    networks:
      - ada-net

  frontend:
    image: tejakumar103/poc_frontend:2.0
    container_name: ada-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - ada-net

volumes:
  mysql_data:

networks:
  ada-net:
    driver: bridge
